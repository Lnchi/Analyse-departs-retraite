<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Visualisation - Départ Retraite</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .legend text {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container py-4">

        <!-- Titre -->
        <div class="row justify-content-center mb-4">
            <div class="col-auto text-center">
                <h1 class="d-flex align-items-center gap-2 justify-content-center">
                    <img src="retraite.jpg" alt="Logo Retraite" style="width:80px; height:80px;">
                    Analyse des départs à la retraite (2013-2020)
                </h1>
            </div>
        </div>

        <!-- Graphique global + donut -->
        <div class="row justify-content-center align-items-center mb-5">
            <div style="flex: 0 0 55%; max-width: 55%;">
                <div id="graph-global">
                    <h2 class="text-center">Évolution globale de l'âge de départ</h2>
                </div>
            </div>
            <div class="d-flex justify-content-center" style="flex: 0 0 35%; max-width: 35%;">
                <div id="donut-global"></div>
            </div>
        </div>

        <!-- Graphique CSP + donut -->
        <div class="row justify-content-center align-items-center mb-5">
            <div style="flex: 0 0 55%; max-width: 55%;">
                <div id="graph-csp">
                    <h2 class="text-center">Évolution par catégorie socioprofessionnelle</h2>
                </div>
            </div>
            <div class="d-flex justify-content-center flex-column align-items-center" style="flex: 0 0 35%; max-width: 35%;">
                <div id="donut-csp">
                    <h3>Légende :</h3>
                    <svg id="legendCSP" width="200" height="150"></svg>
                </div>
            </div>
        </div>

        <!-- Slider -->
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-6 text-center">
                <h2>Répartition par CSP</h2>
                <label class="form-label"><strong>Choisir une année :</strong></label>
                <input type="range" id="yearSlider" class="form-range">
                <span id="yearLabel"></span>
            </div>
        </div>

    </div>

    <script src="global.js"></script>
    <script src="csp.js"></script>
</body>
</html>
